[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gridpulse"
version = "0.1.0"
description = "Where should the next data center be sited to minimize marginal grid carbon? Average vs. marginal emission factors per US balancing authority, from live EIA data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lakshay Mani" }]
keywords = ["energy", "emissions", "marginal", "grid", "carbon", "eia", "data-center", "siting"]

# Core deps are intentionally minimal so the pipeline runs (in CSV-fallback mode)
# on a bare Python. Heavier prod/analysis deps live behind extras.
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Production warehouse + charts. Activates the DuckDB+Parquet path over CSV.
prod = [
    "duckdb>=0.10",
    "pyarrow>=14.0",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "openpyxl>=3.1",
]
# Phase-B research edges (optional, graceful fallback if absent).
research = [
    "cvxpy>=1.4",
    "pymc>=5.10",
    "arviz>=0.17",
    "streamlit>=1.30",
    "plotly>=5.18",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[project.scripts]
gridpulse = "gridpulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
