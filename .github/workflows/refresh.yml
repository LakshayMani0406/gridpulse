name: monthly-refresh

# Live refresh of the EIA warehouse + regenerated results, on the 3rd of each
# month (EIA-930 finalizes prior-month data) and on manual dispatch. Uses the
# EIA_API_KEY repo secret. The warehouse is not persisted across CI runs, so the
# CI window is bounded (default 3 months) to keep runs fast; full multi-year
# backfills are run locally (see README) and are resumable via the manifest.
on:
  schedule:
    - cron: "0 6 3 * *"       # 06:00 UTC on the 3rd
  workflow_dispatch:
    inputs:
      months:
        description: "Backfill window in months"
        required: false
        default: "3"

permissions:
  contents: write             # to commit refreshed results

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[prod,dev]"

      - name: Tests
        run: pytest -q

      - name: Live refresh (bounded window)
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          MONTHS="${{ github.event.inputs.months }}"
          MONTHS="${MONTHS:-3}"
          python -m gridpulse.cli backfill --months "$MONTHS"
          python -m gridpulse.cli run-now
          python -m gridpulse.cli validate --months 3 || echo "validation skipped (workbook fetch)"

      - name: Commit refreshed results + warehouse snapshots
        run: |
          git config user.name "gridpulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/warehouse/*.parquet data/warehouse/manifest.json \
                     docs/report.md data/figs/*.png EVIDENCE.md FINDINGS.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: EIA refresh $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Upload report + figures
        uses: actions/upload-artifact@v4
        with:
          name: gridpulse-report
          path: |
            docs/report.md
            EVIDENCE.md
            FINDINGS.md
            data/figs/*.png
            data/warehouse/*.parquet
